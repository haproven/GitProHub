<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GitProHub Project</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            background:
                linear-gradient(
                    135deg,
                    #f8fafc,
                    #eef2ff
                );
            color: #111827;
            padding: 24px 16px;
        }

        .container {
            width: 100%;
            max-width: 1050px;
            margin: 0 auto;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 20px;
        }

        .brand {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .brand span {
            color: #64748b;
            font-weight: 600;
        }

        button {
            border: 0;
            outline: none;
            cursor: pointer;
            background: #111827;
            color: #ffffff;
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            transition:
                transform 0.2s ease,
                opacity 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none;
        }

        .api-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
            background: #111827;
            color: #ffffff;
            padding: 14px 18px;
            border-radius: 16px;
            margin-bottom: 20px;
        }

        .api-url {
            font-size: 13px;
            opacity: 0.85;
            word-break: break-all;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
        }

        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #f59e0b;
        }

        .status.connected .status-dot {
            background: #22c55e;
        }

        .status.error .status-dot {
            background: #ef4444;
        }

        .project {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 26px;
            overflow: hidden;
            box-shadow:
                0 20px 55px rgba(15, 23, 42, 0.08);
        }

        .project-header {
            padding: 34px;
            border-bottom: 1px solid #e5e7eb;
        }

        .project-title-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 20px;
        }

        .project-name {
            font-size: clamp(30px, 6vw, 48px);
            line-height: 1.05;
            letter-spacing: -1.5px;
            font-weight: 850;
            word-break: break-word;
        }

        .project-description {
            color: #64748b;
            margin-top: 14px;
            line-height: 1.7;
            max-width: 780px;
            font-size: 15px;
            word-break: break-word;
        }

        .badge {
            flex-shrink: 0;
            padding: 8px 13px;
            border-radius: 999px;
            background: #f1f5f9;
            color: #334155;
            font-size: 12px;
            font-weight: 800;
            border: 1px solid #e2e8f0;
        }

        .content {
            padding: 30px 34px 36px;
        }

        .grid {
            display: grid;
            grid-template-columns:
                repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .info-card {
            background: #f8fafc;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            padding: 20px;
            min-width: 0;
        }

        .label {
            color: #64748b;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .value {
            color: #111827;
            font-size: 15px;
            font-weight: 700;
            word-break: break-word;
        }

        .links {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 25px;
        }

        .link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 11px 17px;
            border-radius: 12px;
            background: #111827;
            color: #ffffff;
            text-decoration: none;
            font-size: 13px;
            font-weight: 750;
            transition:
                transform 0.2s ease,
                opacity 0.2s ease;
        }

        .link:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .link.secondary {
            background: #f1f5f9;
            color: #111827;
            border: 1px solid #e2e8f0;
        }

        .link.secondary:hover {
            background: #e2e8f0;
        }

        .sync {
            margin-top: 25px;
            padding-top: 22px;
            border-top: 1px solid #e5e7eb;
        }

        .sync-title {
            font-size: 15px;
            font-weight: 800;
            margin-bottom: 14px;
        }

        .sync-grid {
            display: grid;
            grid-template-columns:
                repeat(3, minmax(0, 1fr));
            gap: 12px;
        }

        .sync-item {
            background: #f8fafc;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 15px;
            min-width: 0;
        }

        .sync-item .label {
            margin-bottom: 6px;
        }

        .sync-item .value {
            font-size: 12px;
            line-height: 1.5;
        }

        .message {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 22px;
            padding: 45px 20px;
            text-align: center;
            color: #64748b;
            box-shadow:
                0 15px 40px rgba(15, 23, 42, 0.06);
        }

        .message-icon {
            font-size: 35px;
            margin-bottom: 12px;
        }

        .message-title {
            color: #111827;
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 7px;
        }

        .message-text {
            font-size: 14px;
            line-height: 1.6;
        }

        .message.error {
            color: #dc2626;
        }

        .message.error .message-title {
            color: #dc2626;
        }

        .loading {
            width: 34px;
            height: 34px;
            margin: 0 auto 15px;
            border: 3px solid #e5e7eb;
            border-top-color: #111827;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        footer {
            text-align: center;
            color: #94a3b8;
            font-size: 13px;
            margin-top: 25px;
        }

        @media (max-width: 700px) {

            body {
                padding: 16px 12px;
            }

            .topbar {
                align-items: flex-start;
            }

            .project-header {
                padding: 25px 20px;
            }

            .content {
                padding: 22px 20px 28px;
            }

            .project-title-row {
                flex-direction: column;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .sync-grid {
                grid-template-columns: 1fr;
            }

            .api-bar {
                align-items: flex-start;
                flex-direction: column;
            }

            .api-url {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="topbar">

            <div class="brand">
                GitProHub
                <span>/ Project</span>
            </div>

            <button
                id="refreshButton"
                type="button"
            >
                Refresh
            </button>

        </div>


        <div class="api-bar">

            <div
                class="api-url"
                id="apiUrl"
            >
                Connecting to GitProHub API...
            </div>

            <div
                class="status"
                id="apiStatus"
            >

                <span class="status-dot"></span>

                <span id="statusText">
                    Connecting...
                </span>

            </div>

        </div>


        <section id="projectContainer">

            <div class="message">

                <div class="loading"></div>

                <div class="message-title">
                    Loading Project
                </div>

                <div class="message-text">
                    GitProHub project data load ho raha hai...
                </div>

            </div>

        </section>


        <footer>
            GitProHub · Powered by Haproven
        </footer>

    </main>


    <script>

        const API_BASE =
            "https://gitprohub.onrender.com";


        const projectContainer =
            document.getElementById(
                "projectContainer"
            );


        const refreshButton =
            document.getElementById(
                "refreshButton"
            );


        const apiUrl =
            document.getElementById(
                "apiUrl"
            );


        const apiStatus =
            document.getElementById(
                "apiStatus"
            );


        const statusText =
            document.getElementById(
                "statusText"
            );


        const params =
            new URLSearchParams(
                window.location.search
            );


        const username =
            (
                params.get("username") ||
                ""
            ).trim();


        const repo =
            (
                params.get("repo") ||
                ""
            ).trim();


        function setStatus(
            type,
            message
        ) {

            apiStatus.classList.remove(
                "connected",
                "error"
            );


            if (type) {

                apiStatus.classList.add(
                    type
                );

            }


            statusText.textContent =
                message;

        }


        function escapeHtml(value) {

            return String(
                value ?? ""
            )
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        function formatDate(value) {

            if (!value) {
                return "Not available";
            }


            const date =
                new Date(value);


            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {

                return escapeHtml(
                    value
                );

            }


            return escapeHtml(
                date.toLocaleString(
                    "en-IN",
                    {
                        dateStyle: "medium",
                        timeStyle: "short"
                    }
                )
            );

        }


        function safeUrl(value) {

            if (
                !value ||
                typeof value !== "string"
            ) {

                return "";

            }


            try {

                const url =
                    new URL(
                        value
                    );


                if (
                    url.protocol === "http:" ||
                    url.protocol === "https:"
                ) {

                    return url.href;

                }

            } catch {
            }


            return "";

        }


        function getProject(
            data
        ) {

            if (
                data?.project &&
                typeof data.project === "object"
            ) {

                return data.project;

            }


            if (
                data?.data?.project &&
                typeof data.data.project === "object"
            ) {

                return data.data.project;

            }


            if (
                data?.result?.project &&
                typeof data.result.project === "object"
            ) {

                return data.result.project;

            }


            if (
                data?.data &&
                typeof data.data === "object" &&
                !Array.isArray(data.data)
            ) {

                return data.data;

            }


            if (
                data?.result &&
                typeof data.result === "object" &&
                !Array.isArray(data.result)
            ) {

                return data.result;

            }


            if (
                typeof data === "object" &&
                data !== null &&
                !Array.isArray(data)
            ) {

                return data;

            }


            return null;

        }


        function getProjectName(
            project
        ) {

            return (
                project?.name ||
                project?.projectName ||
                project?.title ||
                project?.github?.name ||
                project?.repository?.name ||
                project?.repo ||
                repo ||
                "GitProHub Project"
            );

        }


        function getDescription(
            project
        ) {

            return (
                project?.description ||
                project?.summary ||
                project?.projectDescription ||
                project?.github?.description ||
                project?.repository?.description ||
                "No project description available."
            );

        }


        function getUsername(
            project
        ) {

            return (
                project?.developer?.username ||
                project?.developer?.login ||
                project?.github?.owner?.login ||
                project?.github?.owner?.name ||
                project?.owner?.login ||
                project?.owner?.name ||
                project?.username ||
                project?.githubUsername ||
                username ||
                "Unknown"
            );

        }


        function getRepository(
            project
        ) {

            return (
                project?.repository?.name ||
                project?.github?.name ||
                project?.repo ||
                project?.repositoryName ||
                repo ||
                "Unknown"
            );

        }


        function getLanguage(
            project
        ) {

            return (
                project?.language ||
                project?.github?.language ||
                project?.repository?.language ||
                "Not specified"
            );

        }


        function getStars(
            project
        ) {

            return (
                project?.stars ??
                project?.stargazers_count ??
                project?.github?.stars ??
                project?.github?.stargazers_count ??
                project?.repository?.stars ??
                project?.repository?.stargazers_count ??
                0
            );

        }


        function getForks(
            project
        ) {

            return (
                project?.forks ??
                project?.forks_count ??
                project?.github?.forks ??
                project?.github?.forks_count ??
                project?.repository?.forks ??
                project?.repository?.forks_count ??
                0
            );

        }


        function getGithubUrl(
            project
        ) {

            const directUrls = [
                project?.github?.html_url,
                project?.github?.url,
                project?.githubUrl,
                project?.github_url,
                project?.repositoryUrl,
                project?.repository_url,
                project?.repoUrl,
                project?.repo_url,
                project?.html_url
            ];


            for (
                const value of directUrls
            ) {

                const url =
                    safeUrl(
                        value
                    );


                if (url) {
                    return url;
                }

            }


            const currentUsername =
                getUsername(
                    project
                );


            const currentRepository =
                getRepository(
                    project
                );


            if (
                currentUsername &&
                currentUsername !== "Unknown" &&
                currentRepository &&
                currentRepository !== "Unknown"
            ) {

                return (
                    `https://github.com/${encodeURIComponent(
                        currentUsername
                    )}/${encodeURIComponent(
                        currentRepository
                    )}`
                );

            }


            return "";

        }


        function getLiveUrl(
            project
        ) {

            const urls = [
                project?.liveUrl,
                project?.live_url,
                project?.live,
                project?.website,
                project?.demo,
                project?.demoUrl,
                project?.projectUrl,
                project?.project_url,
                project?.links?.live,
                project?.links?.website
            ];


            for (
                const value of urls
            ) {

                const url =
                    safeUrl(
                        value
                    );


                if (url) {
                    return url;
                }

            }


            return "";

        }


        function getSync(
            project
        ) {

            return (
                project?.sync ||
                project?.synchronization ||
                {}
            );

        }


        function createProject(
            project
        ) {

            const projectName =
                getProjectName(
                    project
                );


            const description =
                getDescription(
                    project
                );


            const developer =
                getUsername(
                    project
                );


            const repository =
                getRepository(
                    project
                );


            const language =
                getLanguage(
                    project
                );


            const stars =
                getStars(
                    project
                );


            const forks =
                getForks(
                    project
                );


            const githubUrl =
                getGithubUrl(
                    project
                );


            const liveUrl =
                getLiveUrl(
                    project
                );


            const sync =
                getSync(
                    project
                );


            const projectKey =
                `${developer}/${repository}`;


            return `
                <article class="project">

                    <header class="project-header">

                        <div class="project-title-row">

                            <div>

                                <h1 class="project-name">
                                    ${escapeHtml(projectName)}
                                </h1>

                                <p class="project-description">
                                    ${escapeHtml(description)}
                                </p>

                            </div>

                            <div class="badge">
                                GitProHub
                            </div>

                        </div>

                    </header>


                    <div class="content">

                        <div class="grid">

                            <div class="info-card">

                                <div class="label">
                                    Developer
                                </div>

                                <div class="value">
                                    ${escapeHtml(developer)}
                                </div>

                            </div>


                            <div class="info-card">

                                <div class="label">
                                    Repository
                                </div>

                                <div class="value">
                                    ${escapeHtml(repository)}
                                </div>

                            </div>


                            <div class="info-card">

                                <div class="label">
                                    Language
                                </div>

                                <div class="value">
                                    ${escapeHtml(language)}
                                </div>

                            </div>


                            <div class="info-card">

                                <div class="label">
                                    Stars
                                </div>

                                <div class="value">
                                    ⭐ ${escapeHtml(String(stars))}
                                </div>

                            </div>


                            <div class="info-card">

                                <div class="label">
                                    Forks
                                </div>

                                <div class="value">
                                    ${escapeHtml(String(forks))}
                                </div>

                            </div>


                            <div class="info-card">

                                <div class="label">
                                    Project Key
                                </div>

                                <div class="value">
                                    ${escapeHtml(projectKey)}
                                </div>

                            </div>

                        </div>


                        ${
                            githubUrl || liveUrl
                                ? `
                                    <div class="links">

                                        ${
                                            liveUrl
                                                ? `
                                                    <a
                                                        class="link"
                                                        href="${escapeHtml(liveUrl)}"
                                                        target="_blank"
                                                        rel="noopener noreferrer"
                                                    >
                                                        Live Project
                                                    </a>
                                                `
                                                : ""
                                        }

                                        ${
                                            githubUrl
                                                ? `
                                                    <a
                                                        class="link secondary"
                                                        href="${escapeHtml(githubUrl)}"
                                                        target="_blank"
                                                        rel="noopener noreferrer"
                                                    >
                                                        GitHub Repository
                                                    </a>
                                                `
                                                : ""
                                        }

                                    </div>
                                `
                                : ""
                        }


                        <div class="sync">

                            <div class="sync-title">
                                Synchronization
                            </div>


                            <div class="sync-grid">

                                <div class="sync-item">

                                    <div class="label">
                                        First Seen
                                    </div>

                                    <div class="value">
                                        ${formatDate(
                                            sync.firstSeenAt ||
                                            project?.firstSeenAt
                                        )}
                                    </div>

                                </div>


                                <div class="sync-item">

                                    <div class="label">
                                        Last Checked
                                    </div>

                                    <div class="value">
                                        ${formatDate(
                                            sync.lastCheckedAt ||
                                            project?.lastCheckedAt
                                        )}
                                    </div>

                                </div>


                                <div class="sync-item">

                                    <div class="label">
                                        Last Updated
                                    </div>

                                    <div class="value">
                                        ${formatDate(
                                            sync.lastUpdatedAt ||
                                            project?.lastUpdatedAt ||
                                            project?.updatedAt
                                        )}
                                    </div>

                                </div>

                            </div>

                        </div>

                    </div>

                </article>
            `;

        }


        async function loadProject() {

            if (
                !username ||
                !repo
            ) {

                apiUrl.textContent =
                    "Project parameters missing";


                setStatus(
                    "error",
                    "Invalid project URL"
                );


                projectContainer.innerHTML = `
                    <div class="message error">

                        <div class="message-icon">
                            ⚠️
                        </div>

                        <div class="message-title">
                            Project Parameters Missing
                        </div>

                        <div class="message-text">
                            Username aur repository required hai.
                            <br><br>
                            Example:
                            <br>
                            ?username=codersusheel&repo=haprocard
                        </div>

                    </div>
                `;


                return;

            }


            const endpoint =
                `${API_BASE}/api/project/${encodeURIComponent(
                    username
                )}/${encodeURIComponent(
                    repo
                )}`;


            apiUrl.textContent =
                endpoint;


            refreshButton.disabled =
                true;


            setStatus(
                "",
                "Connecting..."
            );


            projectContainer.innerHTML = `
                <div class="message">

                    <div class="loading"></div>

                    <div class="message-title">
                        Loading Project
                    </div>

                    <div class="message-text">
                        @${escapeHtml(username)}/${escapeHtml(repo)}
                        load ho raha hai...
                    </div>

                </div>
            `;


            try {

                const response =
                    await fetch(
                        endpoint,
                        {
                            method: "GET",
                            cache: "no-store",
                            headers: {
                                "Accept":
                                    "application/json"
                            }
                        }
                    );


                let data = null;


                try {

                    data =
                        await response.json();

                } catch {

                    throw new Error(
                        `Invalid API response (${response.status})`
                    );

                }


                if (
                    !response.ok
                ) {

                    throw new Error(
                        data?.message ||
                        data?.error ||
                        `HTTP ${response.status}`
                    );

                }


                if (
                    data?.success === false
                ) {

                    throw new Error(
                        data?.message ||
                        data?.error ||
                        "Project not found"
                    );

                }


                const project =
                    getProject(
                        data
                    );


                if (
                    !project
                ) {

                    throw new Error(
                        "Project data API response mein nahi mila."
                    );

                }


                projectContainer.innerHTML =
                    createProject(
                        project
                    );


                setStatus(
                    "connected",
                    "API Connected"
                );

            } catch (
                error
            ) {

                console.error(
                    "GitProHub API Error:",
                    error
                );


                projectContainer.innerHTML = `
                    <div class="message error">

                        <div class="message-icon">
                            ⚠️
                        </div>

                        <div class="message-title">
                            Project Load Failed
                        </div>

                        <div class="message-text">
                            ${escapeHtml(
                                error?.message ||
                                "Unable to load project."
                            )}
                        </div>

                    </div>
                `;


                setStatus(
                    "error",
                    "API Connection Failed"
                );

            } finally {

                refreshButton.disabled =
                    false;

            }

        }


        refreshButton.addEventListener(
            "click",
            loadProject
        );


        loadProject();

    </script>

</body>

</html>
