<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GitProHub Projects</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f6f8fb;
            color: #172033;
            min-height: 100vh;
        }

        .page {
            width: 100%;
            max-width: 1250px;
            margin: auto;
            padding: 45px 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 35px;
        }

        .header-left h1 {
            font-size: 34px;
            line-height: 1.2;
            margin-bottom: 8px;
        }

        .header-left p {
            color: #687386;
            font-size: 15px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .count {
            padding: 10px 16px;
            border-radius: 12px;
            background: #ffffff;
            border: 1px solid #e5e9f0;
            font-size: 14px;
            font-weight: 600;
        }

        .refresh-btn {
            border: 0;
            background: #172033;
            color: #fff;
            padding: 11px 17px;
            border-radius: 11px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .refresh-btn:hover {
            opacity: .9;
        }

        .status-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 25px;
            font-size: 13px;
            color: #687386;
        }

        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #16a34a;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
        }

        .project-card {
            background: #fff;
            border: 1px solid #e5e9f0;
            border-radius: 18px;
            padding: 22px;
            min-height: 250px;
            display: flex;
            flex-direction: column;
            transition: transform .2s ease, box-shadow .2s ease;
        }

        .project-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 35px rgba(23, 32, 51, .08);
        }

        .project-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 18px;
        }

        .project-icon {
            width: 48px;
            height: 48px;
            border-radius: 13px;
            background: #172033;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .status {
            padding: 6px 10px;
            border-radius: 999px;
            background: #eef8f1;
            color: #16803d;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
        }

        .project-card h2 {
            font-size: 20px;
            margin-bottom: 8px;
            word-break: break-word;
        }

        .developer {
            color: #667085;
            font-size: 13px;
            margin-bottom: 14px;
        }

        .description {
            color: #596579;
            font-size: 14px;
            line-height: 1.65;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .project-footer {
            display: flex;
            gap: 9px;
            margin-top: auto;
            padding-top: 22px;
        }

        .project-link {
            text-decoration: none;
            border: 1px solid #dfe4ec;
            color: #172033;
            padding: 9px 13px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            transition: .2s;
        }

        .project-link:hover {
            background: #172033;
            color: #fff;
            border-color: #172033;
        }

        .loading,
        .empty,
        .error {
            grid-column: 1 / -1;
            background: #fff;
            border: 1px solid #e5e9f0;
            border-radius: 18px;
            padding: 50px 20px;
            text-align: center;
            color: #687386;
        }

        .error {
            color: #b42318;
            background: #fff7f6;
            border-color: #f3c7c2;
        }

        @media (max-width: 950px) {
            .projects-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 650px) {
            .page {
                padding: 30px 15px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .header-right {
                width: 100%;
            }

            .count {
                flex: 1;
            }

            .projects-grid {
                grid-template-columns: 1fr;
            }

            .header-left h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <header class="header">
            <div class="header-left">
                <h1>GitProHub Projects</h1>
                <p>Projects discovered from GitHub through GitProHub.</p>
            </div>

            <div class="header-right">
                <div class="count" id="projectCount">
                    0 Projects
                </div>

                <button class="refresh-btn" id="refreshBtn">
                    Refresh
                </button>
            </div>
        </header>

        <div class="status-bar">
            <span class="status-dot"></span>
            <span id="statusText">Connecting to GitProHub API...</span>
        </div>

        <section id="projectsContainer" class="projects-grid">
            <div class="loading">
                Loading projects...
            </div>
        </section>

    </main>

    <script>
        const projectsContainer = document.getElementById("projectsContainer");
        const projectCount = document.getElementById("projectCount");
        const statusText = document.getElementById("statusText");
        const refreshBtn = document.getElementById("refreshBtn");

        function getProjects(data) {
            if (Array.isArray(data)) {
                return data;
            }

            if (Array.isArray(data.projects)) {
                return data.projects;
            }

            if (data.result && Array.isArray(data.result)) {
                return data.result;
            }

            if (data.result && Array.isArray(data.result.projects)) {
                return data.result.projects;
            }

            if (Array.isArray(data.data)) {
                return data.data;
            }

            if (data.data && Array.isArray(data.data.projects)) {
                return data.data.projects;
            }

            if (Array.isArray(data.items)) {
                return data.items;
            }

            return [];
        }

        function getValue(project, keys, fallback = "") {
            for (const key of keys) {
                if (
                    project[key] !== undefined &&
                    project[key] !== null &&
                    project[key] !== ""
                ) {
                    return project[key];
                }
            }

            return fallback;
        }

        function createCard(project) {
            const name = getValue(
                project,
                ["name", "projectName", "title", "repo", "repository"],
                "Unnamed Project"
            );

            const developer = getValue(
                project,
                ["username", "developer", "owner", "author", "user"],
                "GitHub Developer"
            );

            const description = getValue(
                project,
                ["description", "summary", "about"],
                "No project description available."
            );

            const status = getValue(
                project,
                ["status", "projectStatus"],
                "Active"
            );

            const github = getValue(
                project,
                ["github", "githubUrl", "repositoryUrl", "repoUrl", "url"],
                ""
            );

            const live = getValue(
                project,
                ["live", "liveUrl", "website", "demo", "demoUrl"],
                ""
            );

            const firstLetter = String(name).charAt(0).toUpperCase();

            const card = document.createElement("article");
            card.className = "project-card";

            card.innerHTML = `
                <div class="project-top">
                    <div class="project-icon">
                        ${escapeHtml(firstLetter)}
                    </div>

                    <span class="status">
                        ${escapeHtml(status)}
                    </span>
                </div>

                <h2>${escapeHtml(name)}</h2>

                <div class="developer">
                    ${escapeHtml(developer)}
                </div>

                <div class="description">
                    ${escapeHtml(description)}
                </div>

                <div class="project-footer">
                    ${
                        github
                            ? `<a class="project-link" href="${escapeAttribute(github)}" target="_blank" rel="noopener noreferrer">GitHub</a>`
                            : ""
                    }

                    ${
                        live
                            ? `<a class="project-link" href="${escapeAttribute(live)}" target="_blank" rel="noopener noreferrer">Live Demo</a>`
                            : ""
                    }
                </div>
            `;

            return card;
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function escapeAttribute(value) {
            return escapeHtml(value);
        }

        async function loadProjects() {
            projectsContainer.innerHTML = `
                <div class="loading">
                    Loading projects...
                </div>
            `;

            statusText.textContent = "Loading projects...";

            try {
                const response = await fetch("/api/projects", {
                    method: "GET",
                    headers: {
                        "Accept": "application/json"
                    },
                    cache: "no-store"
                });

                if (!response.ok) {
                    throw new Error(`API Error: ${response.status}`);
                }

                const data = await response.json();
                const projects = getProjects(data);

                projectCount.textContent =
                    `${projects.length} ${projects.length === 1 ? "Project" : "Projects"}`;

                projectsContainer.innerHTML = "";

                if (!projects.length) {
                    projectsContainer.innerHTML = `
                        <div class="empty">
                            No GitProHub projects found.
                        </div>
                    `;

                    statusText.textContent = "API connected • No projects found";
                    return;
                }

                projects.forEach(project => {
                    projectsContainer.appendChild(
                        createCard(project)
                    );
                });

                statusText.textContent =
                    `API connected • ${projects.length} projects loaded`;

            } catch (error) {
                console.error(error);

                projectCount.textContent = "0 Projects";

                projectsContainer.innerHTML = `
                    <div class="error">
                        <strong>Unable to load projects</strong>
                        <br>
                        <span>Check that the GitProHub API is running.</span>
                    </div>
                `;

                statusText.textContent = "API connection failed";
            }
        }

        refreshBtn.addEventListener("click", loadProjects);

        loadProjects();

        setInterval(loadProjects, 60000);
    </script>

</body>
</html>
